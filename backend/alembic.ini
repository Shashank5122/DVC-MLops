[alembic]
script_location = alembic
path_separator = os
prepend_sys_path = .
# The URL is read from the application settings in alembic/env.py; this is only a fallback
# so that `alembic` does not error when invoked without environment configuration.
sqlalchemy.url = sqlite:///./signalgeo.db
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
